name: Real Code OSS GUI smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install official native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libgtk-3-0t64 libgbm1 libnss3 libasound2t64 xvfb imagemagick
      - name: Bootstrap the service
        run: ./scripts/bootstrap.sh
      - name: Install notebook kernel
        run: .venv/bin/python -m pip install ipykernel==6.30.1
      - name: Build pinned branded source distribution
        run: ./scripts/build_ide.sh build
      - name: Run actual GUI, LSP, notebook, debugger, terminal and Git tests
        env:
          MODELBUILDER_GUI_APPROVE_FIXTURE_TRUST: '1'
        run: xvfb-run -a ./scripts/smoke_ide.sh
      - name: Run actual graph, JSON and external MCP parity tests
        env:
          MODELBUILDER_GUI_APPROVE_FIXTURE_TRUST: '1'
        run: xvfb-run -a ./scripts/smoke_ide.sh --workbench
      - name: Bootstrap the pinned CPU backend
        run: ./scripts/bootstrap.sh --backend
      - name: Submit the shipping CPU fixture through the actual Runs UI
        env:
          MODELBUILDER_GUI_APPROVE_FIXTURE_TRUST: '1'
        run: xvfb-run -a ./scripts/smoke_ide.sh --execution
      - name: Preserve actual screenshots, failures and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-code-oss-gui-evidence
          path: evidence/gui/
